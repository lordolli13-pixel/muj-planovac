<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Plánovač 2026</title>
    <style>
        :root { --bg: #121212; --panel: #1e1e1e; --text: #e0e0e0; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; padding: 10px; display: flex; justify-content: center; }
        .wrapper { width: 100%; max-width: 500px; display: flex; flex-direction: column; gap: 10px; }
        .panel { background: var(--panel); padding: 12px; border-radius: 8px; border: 1px solid #333; }
        .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; margin-top: 10px; }
        .day-name { text-align: center; font-size: 0.7rem; color: #888; padding-bottom: 5px; }
        .day { aspect-ratio: 1; background: #2a2a2a; display: flex; align-items: center; justify-content: center; cursor: pointer; border-radius: 4px; font-size: 0.9rem; border: 1px solid transparent; user-select: none; }
        .day.has-notes { border-bottom: 4px solid #ffffff; }
        .day.prace { background: #8b0000; } .day.dovolena { background: #8b7500; } .day.volno { background: #006400; }
        .btn { padding: 12px; border: none; border-radius: 6px; cursor: pointer; color: white; background: #333; margin: 2px; font-size: 1rem; }
        #modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.9); align-items:flex-end; justify-content:center; z-index:100; }
        .modal-content { background: #1e1e1e; width: 100%; max-height: 90vh; overflow-y: auto; padding: 20px; border-top-left-radius: 15px; border-top-right-radius: 15px; }
        .evt-input { width: 100%; background: #111; color: white; border: 1px solid #444; padding: 12px; border-radius: 6px; margin-bottom: 10px; box-sizing: border-box; }
        .person-btn { padding: 8px; border: 1px solid #555; cursor: pointer; margin: 2px; opacity: 0.5; }
        .person-btn.active { opacity: 1; border-color: #fff; }
    </style>
</head>
<body>
<div class="wrapper">
    <div class="panel">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <button class="btn" onclick="changeMonth(-1)">◀</button>
            <div id="monthLabel" style="font-weight:bold;"></div>
            <button class="btn" onclick="changeMonth(1)">▶</button>
        </div>
        <div class="grid" id="calendarGrid">Načítám...</div>
    </div>
    <div class="panel">
        <button class="btn" style="width:100%; background:#059669;" onclick="loadData()">🔄 Obnovit data</button>
    </div>
</div>

<div id="modal">
    <div class="modal-content">
        <h3 id="modalTitle">Detaily</h3>
        <div id="eventInputs"></div>
        <button class="btn" onclick="saveData()" style="width:100%; background:#005a9e;">Uložit</button>
        <button class="btn" onclick="document.getElementById('modal').style.display='none'" style="width:100%; background:#444;">Zavřít</button>
    </div>
</div>

<script>
    
    const SCRIPT_URL = 'ZDE_VLOZTE_VASI_URL_KONCICI_EXEC';
    let date = new Date(), allData = {}, selectedDay = 1;

    async function loadData() {
        try {
            const response = await fetch(SCRIPT_URL);
            const data = await response.json();
            allData = data;
            render();
        } catch(e) {
            document.getElementById('calendarGrid').innerText = "Chyba: " + e.message;
        }
    }

    function render() {
        const grid = document.getElementById('calendarGrid'); grid.innerHTML = "";
        ["Po", "Út", "St", "Čt", "Pá", "So", "Ne"].forEach(d => grid.innerHTML += `<div class="day-name">${d}</div>`);
        document.getElementById('monthLabel').innerText = date.toLocaleDateString('cs', {month:'long', year:'numeric'});
        
        const firstDay = (new Date(date.getFullYear(), date.getMonth(), 1).getDay() + 6) % 7;
        for(let i=0; i<firstDay; i++) grid.innerHTML += '<div></div>';
        
        const days = new Date(date.getFullYear(), date.getMonth() + 1, 0).getDate();
        for(let i=1; i<=days; i++) {
            let key = `${date.getFullYear()}-${date.getMonth()}-${i}`;
            let d = document.createElement('div');
            d.className = 'day ' + (allData[key]?.status || '');
            d.innerText = i;
            d.onclick = () => alert("V tento den: " + (allData[key]?.status || "nic"));
            grid.appendChild(d);
        }
    }

    function changeMonth(dir) { date.setMonth(date.getMonth() + dir); render(); }
    
    // Spuštění
    loadData();
</script>
</body>
</html>
