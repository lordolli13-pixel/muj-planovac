<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>Plánovač 2026</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background: #121212; color: #fff; font-family: sans-serif; padding: 20px; }
        .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
        .day { aspect-ratio: 1; background: #333; display: flex; align-items: center; justify-content: center; border-radius: 4px; }
    </style>
</head>
<body>
    <div id="log" style="color: yellow;">Načítám...</div>
    <div class="grid" id="grid"></div>

    <script>
        // TVOJE ÚDAJE
        const supabase = supabase.createClient('https://ncstippolhiaojmnzcgd.supabase.co', 'sb_publishable_k_adk4_lKGUkAv37cQXyfg_KDCL6AOE');
        
        // Vykreslíme kalendář HNED, bez čekání na databázi
        const grid = document.getElementById('grid');
        for(let i=1; i<=30; i++) {
            let div = document.createElement('div');
            div.className = 'day'; div.innerText = i;
            grid.appendChild(div);
        }

        // Teprve teď zkusíme načíst data
        async function load() {
            try {
                const { data, error } = await supabase.from('planovac').select('*').eq('id', 'hlavni').single();
                if (error) {
                    document.getElementById('log').innerText = "Chyba DB: " + error.message;
                } else {
                    document.getElementById('log').innerText = "Databáze připravena.";
                }
            } catch(e) {
                document.getElementById('log').innerText = "Fatální chyba: " + e;
            }
        }
        load();
    </script>
</body>
</html>
